<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 12px/1.5 Inter, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: var(--figma-color-text); background: var(--figma-color-bg); }
    h1 { margin: 0 0 6px; font-size: 15px; }
    p { margin: 0 0 14px; color: var(--figma-color-text-secondary); }
    .panel { padding: 12px; margin-bottom: 12px; border: 1px solid var(--figma-color-border); border-radius: 6px; }
    .label { display: block; margin-bottom: 6px; font-weight: 600; }
    #selection { min-height: 36px; margin-bottom: 10px; }
    #links { max-height: 190px; padding: 0; margin: 10px 0 0; overflow: auto; list-style: none; }
    #links li { padding: 8px 0; border-top: 1px solid var(--figma-color-border); }
    #links strong, #links small { display: block; overflow-wrap: anywhere; }
    #links small { margin-top: 2px; color: var(--figma-color-text-secondary); }
    .empty { color: var(--figma-color-text-secondary); }
    input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--figma-color-border); border-radius: 4px; color: var(--figma-color-text); background: var(--figma-color-bg); }
    input:focus { outline: 2px solid var(--figma-color-border-selected); outline-offset: -1px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { height: 32px; padding: 0 12px; border: 0; border-radius: 4px; cursor: pointer; }
    button.primary { color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); }
    button.secondary { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
    button:disabled { cursor: default; opacity: .45; }
    #status { min-height: 18px; margin-top: 10px; color: var(--figma-color-text-secondary); }
  </style>
</head>
<body>
  <h1>SVG Link Exporter</h1>
  <p>レイヤー名からリンクを生成し、リンク付きSVGを書き出します。</p>

  <section class="panel">
    <label class="label" for="base-url">ベースURL</label>
    <input id="base-url" type="url" placeholder="https://example.com/maps/">
    <div class="row">
      <button id="save-base-url" class="primary">ベースURLを保存</button>
    </div>
  </section>

  <section class="panel">
    <span class="label">レイヤー命名規則</span>
    <p><code>link:detail-page</code></p>
    <p>フレーム内のテキストがリンク名として使用されます。リンク対象外のレイヤーは名前を変更する必要がありません。</p>
  </section>

  <section class="panel">
    <span class="label">SVG書き出し</span>
    <div id="selection">フレームを選択してください</div>
    <span class="label">検出したリンク対象</span>
    <ul id="links"><li class="empty">リンク対象はありません</li></ul>
    <p>書き出したいフレームを選択してください。複数選択にも対応します。</p>
    <button id="export" class="primary">選択フレームを書き出す</button>
    <div id="status"></div>
  </section>

  <script>
    const selection = document.getElementById('selection');
    const links = document.getElementById('links');
    const baseUrl = document.getElementById('base-url');
    const saveBaseUrl = document.getElementById('save-base-url');
    const exportButton = document.getElementById('export');
    const status = document.getElementById('status');

    const post = (message) => parent.postMessage({ pluginMessage: message }, '*');

    saveBaseUrl.onclick = () => post({ type: 'set-base-url', url: baseUrl.value });
    exportButton.onclick = () => {
      exportButton.disabled = true;
      status.textContent = 'SVGを生成しています…';
      post({ type: 'export-svg' });
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === 'selection-state') {
        baseUrl.value = message.baseUrl;
        selection.textContent = message.count
          ? `${message.count}件を選択中／リンク対象 ${message.links.length}件`
          : 'フレームを選択してください';
        links.replaceChildren();
        if (message.links.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'リンク対象はありません';
          links.appendChild(empty);
        } else {
          message.links.forEach((link) => {
            const item = document.createElement('li');
            const name = document.createElement('strong');
            const generatedUrl = document.createElement('small');
            name.textContent = link.frameName;
            generatedUrl.textContent = message.baseUrl ? link.url : 'ベースURLが未設定です';
            item.append(name, generatedUrl);
            links.appendChild(item);
          });
        }
        exportButton.disabled = message.count === 0 || !message.baseUrl;
      }

      if (message.type === 'export-result') {
        message.files.forEach((file, index) => {
          setTimeout(() => {
            const blob = new Blob([file.content], { type: 'image/svg+xml;charset=utf-8' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = file.name;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(anchor.href), 1000);
          }, index * 120);
        });
        const links = message.files.reduce((total, file) => total + file.linkCount, 0);
        status.textContent = `${message.files.length}ファイル、リンク${links}件を書き出しました。`;
        exportButton.disabled = false;
      }
    };
  </script>
</body>
</html>
