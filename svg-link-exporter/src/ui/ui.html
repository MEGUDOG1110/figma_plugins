<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>SVG Link Exporter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>SVG Link Exporter</h1>
    </div>
    <div id="selection" class="selection-badge" aria-live="polite">未選択</div>
  </header>

  <main>
    <section aria-labelledby="settings-heading">
      <div class="section-heading">
        <h2 id="settings-heading">書き出し設定</h2>
      </div>

      <div class="settings-panel">
        <div class="field">
          <div class="field-heading">
            <label for="base-url">ベースURL</label>
            <span class="optional">通常リンク用</span>
          </div>
          <input id="base-url" class="text-input" type="url" placeholder="https://example.com/maps/">
          <p class="helper">フォーカスを外すと、この端末に保存されます。</p>
        </div>

      </div>

      <div class="naming-guide">
        <div class="naming-guide-rule">
          <span>レイヤーの命名規則</span>
          <code>link:page_name</code>
        </div>
        <p>フレーム内で最初に見つかったテキストを、リンクのアクセシブルな名前として使用します。</p>
      </div>
    </section>

    <section class="links-section" aria-labelledby="links-heading">
      <div class="section-heading links-heading">
        <div class="heading-with-count">
          <div>
            <h2 id="links-heading">フレーム別のリンク</h2>
          </div>
          <span id="link-count" class="count-badge">0</span>
        </div>

        <fieldset id="bulk-options" class="bulk-options" hidden>
          <legend>すべて変更</legend>
          <div class="segmented-control segmented-small">
            <label><input type="radio" name="bulk-kind" value="link"><span>URL</span></label>
            <label><input type="radio" name="bulk-kind" value="anchor"><span>ページ内</span></label>
          </div>
        </fieldset>
      </div>

      <ul id="links" aria-live="polite">
        <li class="empty">
          <span class="empty-icon" aria-hidden="true">↗</span>
          <strong>リンク対象はありません</strong>
          <small><code>link:</code> から始まるレイヤーを検出します</small>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="export" class="primary" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 1.75v7.5m0 0 2.75-2.75M8 9.25 5.25 6.5M2.25 10.75v2.5h11.5v-2.5"/>
      </svg>
      <span id="export-label">フレームを選択してください</span>
    </button>
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
