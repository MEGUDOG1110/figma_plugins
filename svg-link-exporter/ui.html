<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SVG Link Exporter</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 12px/1.5 Inter, sans-serif;
      --brand-url: #132bdd;
      --brand-anchor: #d118e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand-url: #7182ff;
        --brand-anchor: #ed72f7;
      }
    }
    * { box-sizing: border-box; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; color: var(--figma-color-text); background: var(--figma-color-bg); }
    main { flex: 1; min-height: 0; padding: 16px; overflow-y: auto; }
    section + section { margin-top: 20px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .label { display: block; font-weight: 600; }
    .meta, .helper, #selection, #status { color: var(--figma-color-text-secondary); }
    .helper { margin: 6px 0 0; font-size: 11px; }
    #selection { margin-top: 2px; font-size: 11px; }
    #links { padding: 0; margin: 0; list-style: none; border-top: 1px solid var(--figma-color-border); }
    #links li { padding: 12px 0; border-bottom: 1px solid var(--figma-color-border); }
    #links strong, #links small { display: block; overflow-wrap: anywhere; }
    #links strong { font-size: 12px; font-weight: 600; }
    #links small { margin-top: 2px; color: var(--figma-color-text-secondary); }
    .link-row { display: block; }
    .link-info { position: relative; min-width: 0; margin-bottom: 6px; padding-left: 14px; }
    .link-info::before { position: absolute; top: 6px; left: 1px; width: 6px; height: 6px; border-radius: 50%; content: ''; }
    .kind-link .link-info::before { background: var(--brand-url); }
    .kind-anchor .link-info::before { background: var(--brand-anchor); }
    .kind-options { display: flex; flex: none; align-items: center; gap: 8px; }
    .kind-options label { display: inline-flex; align-items: center; gap: 4px; padding: 2px; white-space: nowrap; cursor: pointer; font-size: 11px; }
    .kind-options input { width: 12px; height: 12px; margin: 0; cursor: pointer; }
    .kind-options input[value="link"] { accent-color: var(--brand-url); }
    .kind-options input[value="anchor"] { accent-color: var(--brand-anchor); }
    .bulk-options { display: flex; align-items: center; gap: 12px; }
    .bulk-options > span { color: var(--figma-color-text-secondary); font-size: 11px; }
    .empty { color: var(--figma-color-text-secondary); text-align: center; }
    .text-input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--figma-color-border); border-radius: 4px; color: var(--figma-color-text); background: var(--figma-color-bg); }
    .text-input:focus { outline: 2px solid var(--figma-color-border-selected); outline-offset: -1px; }
    .naming-rule { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--figma-color-border); border-bottom: 1px solid var(--figma-color-border); }
    code { padding: 2px 4px; border-radius: 3px; color: var(--figma-color-text); background: var(--figma-color-bg-secondary); font: 11px/16px Roboto Mono, monospace; }
    footer { flex: none; padding: 12px 16px 16px; border-top: 1px solid var(--figma-color-border); background: var(--figma-color-bg); }
    button { height: 32px; padding: 0 12px; border: 0; border-radius: 4px; cursor: pointer; }
    button.primary { width: 100%; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); font-weight: 500; }
    button:disabled { cursor: default; opacity: .45; }
    #status { min-height: 18px; margin-bottom: 6px; font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <h1 class="visually-hidden">SVG Link Exporter</h1>
  <main>
    <section>
      <div class="naming-rule">
        <span class="meta">レイヤー命名規則</span>
        <code>link:page_name</code>
      </div>
      <p class="helper">フレーム内の最初のテキストをリンク名に使用します。</p>
    </section>
    <section>
      <div class="section-heading"><label class="label" for="base-url">ベースURL</label></div>
      <input id="base-url" class="text-input" type="url" placeholder="https://example.com/maps/">
      <p class="helper">通常リンクに使用。フォーカスを外すと保存されます。</p>
    </section>
    <section>
      <div class="section-heading"><label class="label" for="svg-label">SVGのaria-label <span class="meta">（任意）</span></label></div>
      <input id="svg-label" class="text-input" type="text" placeholder="例: フロアマップ" disabled>
      <p class="helper">選択中のフレームに、SVG全体のアクセシブルな名前を設定します。</p>
    </section>
    <section>
      <div class="section-heading">
        <div>
          <span id="link-count" class="label">リンク対象 0</span>
          <div id="selection">フレームを選択してください</div>
        </div>
        <div id="bulk-options" class="bulk-options" hidden>
          <span>すべて</span>
          <div class="kind-options">
            <label><input type="radio" name="bulk-kind" value="link">URL</label>
            <label><input type="radio" name="bulk-kind" value="anchor">アンカー</label>
          </div>
        </div>
      </div>
      <ul id="links"><li class="empty">リンク対象はありません</li></ul>
    </section>
  </main>
  <footer>
    <div id="status"></div>
    <button id="export" class="primary" disabled>フレームを選択してください</button>
  </footer>

  <script>
    const selection = document.getElementById('selection');
    const linkCount = document.getElementById('link-count');
    const links = document.getElementById('links');
    const bulkOptions = document.getElementById('bulk-options');
    const baseUrl = document.getElementById('base-url');
    const svgLabel = document.getElementById('svg-label');
    const exportButton = document.getElementById('export');
    const status = document.getElementById('status');

    const post = (message) => parent.postMessage({ pluginMessage: message }, '*');
    let currentLinks = [];
    let savedBaseUrl = '';
    let canExport = false;
    let currentSelectionIds = [];
    let savedSvgLabel = null;
    let isComposingSvgLabel = false;

    bulkOptions.onchange = (event) => {
      if (event.target.name !== 'bulk-kind') return;
      post({
        type: 'set-all-link-kinds',
        nodeIds: currentLinks.map((link) => link.nodeId),
        kind: event.target.value,
      });
    };

    const saveBaseUrl = () => {
      if (baseUrl.value.trim() !== savedBaseUrl) {
        post({ type: 'set-base-url', url: baseUrl.value });
      }
    };
    baseUrl.onblur = saveBaseUrl;
    baseUrl.onkeydown = (event) => {
      if (event.key === 'Enter') baseUrl.blur();
    };
    const saveSvgLabel = () => {
      if (currentSelectionIds.length && svgLabel.value.trim() !== savedSvgLabel) {
        post({ type: 'set-svg-label', nodeIds: currentSelectionIds, label: svgLabel.value });
      }
    };
    svgLabel.onblur = saveSvgLabel;
    svgLabel.oncompositionstart = () => { isComposingSvgLabel = true; };
    svgLabel.oncompositionend = () => { isComposingSvgLabel = false; };
    svgLabel.onkeydown = (event) => {
      if (
        event.key === 'Enter'
        && !event.isComposing
        && event.keyCode !== 229
        && !isComposingSvgLabel
      ) svgLabel.blur();
    };
    exportButton.onclick = () => {
      exportButton.disabled = true;
      status.textContent = 'SVGを生成しています…';
      post({ type: 'export-svg' });
    };

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === 'selection-state') {
        currentLinks = message.links;
        currentSelectionIds = message.svgLabels.map((item) => item.nodeId);
        savedBaseUrl = message.baseUrl;
        if (document.activeElement !== baseUrl) baseUrl.value = message.baseUrl;
        const labels = [...new Set(message.svgLabels.map((item) => item.label))];
        const hasCommonLabel = labels.length === 1;
        savedSvgLabel = hasCommonLabel ? labels[0] : null;
        if (document.activeElement !== svgLabel && !isComposingSvgLabel) {
          svgLabel.value = savedSvgLabel ?? '';
        }
        svgLabel.disabled = message.count === 0;
        svgLabel.placeholder = labels.length > 1 ? '複数の値' : '例: フロアマップ';
        linkCount.textContent = `リンク対象 ${message.links.length}`;
        selection.textContent = message.count
          ? `${message.count}フレームを選択中`
          : 'フレームを選択してください';
        links.replaceChildren();
        bulkOptions.hidden = message.links.length === 0;
        bulkOptions.querySelectorAll('input').forEach((input) => {
          input.checked = message.links.length > 0
            && message.links.every((link) => link.kind === input.value);
        });
        if (message.links.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'リンク対象はありません';
          links.appendChild(empty);
        } else {
          message.links.forEach((link) => {
            const item = document.createElement('li');
            item.className = `link-row kind-${link.kind}`;
            const info = document.createElement('div');
            info.className = 'link-info';
            const name = document.createElement('strong');
            const generatedUrl = document.createElement('small');
            name.textContent = link.frameName.replace(/^(link|anchor):/, '');
            generatedUrl.textContent = link.url.startsWith('#') || message.baseUrl
              ? link.url
              : 'ベースURLが未設定です';
            info.append(name, generatedUrl);

            const options = document.createElement('div');
            options.className = 'kind-options';
            ['link', 'anchor'].forEach((kind) => {
              const label = document.createElement('label');
              const radio = document.createElement('input');
              radio.type = 'radio';
              radio.name = `kind-${link.nodeId}`;
              radio.value = kind;
              radio.checked = link.kind === kind;
              radio.setAttribute('aria-label', kind === 'link' ? '通常リンク' : 'ページ内アンカー');
              radio.onchange = () => post({ type: 'set-link-kind', nodeId: link.nodeId, kind });
              label.append(radio, kind === 'link' ? 'URL' : 'アンカー');
              options.appendChild(label);
            });
            item.append(info, options);
            links.appendChild(item);
          });
        }
        const needsBaseUrl = message.requiresBaseUrl && !message.baseUrl;
        canExport = message.count > 0 && !needsBaseUrl;
        exportButton.disabled = !canExport;
        exportButton.textContent = message.count
          ? `選択した${message.count}フレームを書き出す`
          : 'フレームを選択してください';
        status.textContent = needsBaseUrl ? '通常リンクにはベースURLが必要です' : '';
      }

      if (message.type === 'export-result') {
        message.files.forEach((file, index) => {
          setTimeout(() => {
            const blob = new Blob([file.content], { type: 'image/svg+xml;charset=utf-8' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = file.name;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(anchor.href), 1000);
          }, index * 120);
        });
        const links = message.files.reduce((total, file) => total + file.linkCount, 0);
        status.textContent = `${message.files.length}ファイル、リンク${links}件を書き出しました。`;
        exportButton.disabled = !canExport;
      }
    };
  </script>
</body>
</html>
